name: Build APK (Amora)

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx tsc --noEmit
      # Notifikasi push: isi secret GOOGLE_SERVICES_JSON (isi file google-services.json dari Firebase,
      # boleh polos atau base64). Tanpa secret, APK tetap jadi tapi tanpa notifikasi push.
      - name: Siapkan google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ] && [ ! -f google-services.json ]; then
            if echo "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then
              echo "$GOOGLE_SERVICES_JSON" > google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" | base64 -d > google-services.json
            fi
            echo "google-services.json dipasang dari secret"
          else
            echo "::notice::GOOGLE_SERVICES_JSON tidak diisi / file sudah ada: lanjut tanpa mengganti"
          fi
      - run: npx expo prebuild -p android --clean --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: app/android
      - uses: actions/upload-artifact@v4
        with:
          name: amora-apk
          path: app/android/app/build/outputs/apk/release/*.apk
